services:
  postgres:
    image: postgres:16-alpine
    container_name: jetflow_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jetflow
      POSTGRES_PASSWORD: jetflow
      POSTGRES_DB: jetflow
    ports:
      - "5442:5432"
    volumes:
      - jetflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetflow -d jetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jetflow_api_redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - jetflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.5
    container_name: jetflow_api_clamav
    restart: unless-stopped
    ports:
      - "3320:3310"
    volumes:
      - jetflow_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  jetflow_pg_data:
  jetflow_redis_data:
  jetflow_clamav_data:
