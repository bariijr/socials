# ─────────────────────────────────────────────────────────────────────────────
# MikoPBX — Production Docker Compose
# Web UI on host port 4000 → NPM forward to 107.174.35.100:4000
# SIP/RTP ports bound directly to host (VoIP requires direct routing)
# ─────────────────────────────────────────────────────────────────────────────

services:
  mikopbx:
    image: ghcr.io/mikopbx/mikopbx-x86-64:latest
    container_name: mikopbx_app
    restart: unless-stopped
    privileged: true
    entrypoint: ["/bin/sh", "-c", "mknod -m 622 /dev/console c 5 1 2>/dev/null; exec /sbin/docker-entrypoint"]
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    environment:
      - TZ=${TZ}
    ports:
      # Web admin UI — NPM forwards pbx.insider.co.tz → host:4000 → container:80
      - "4000:80/tcp"
      # SIP signaling — UDP + TCP
      - "${HOST_IP}:5060:5060/udp"
      - "${HOST_IP}:5060:5060/tcp"
      # SIP over TLS
      - "${HOST_IP}:5061:5061/tcp"
      # RTP media streams
      - "${HOST_IP}:10000-10200:10000-10200/udp"
      # SSH admin console (MikoPBX built-in)
      - "127.0.0.1:${MIKOPBX_SSH_PORT}:222/tcp"
    volumes:
      - mikopbx_cf:/cf
      - mikopbx_storage:/storage
      - /var/backups/${HOSTNAME}/mikopbx:/backups:rw
    networks:
      - web-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mikopbx_cf:
    driver: local
    name: mikopbx_cf
  mikopbx_storage:
    driver: local
    name: mikopbx_storage

networks:
  web-proxy:
    external: true
